name: Publish Browslium international website

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify archive and replace old website
        shell: bash
        run: |
          set -euo pipefail
          archive='Browslium_WEB_INTERNATIONAL_7LOCALES_R1_20261006_170038.zip'
          expected_sha='e66abdb043fe6e1ffd8a2364c744274776e2f9e7a966907a34e59367c14260a0'
          test -f "$archive"
          actual_sha="$(sha256sum "$archive" | cut -d ' ' -f1)"
          test "$actual_sha" = "$expected_sha"
          stage="$(mktemp -d)"
          unzip -q "$archive" -d "$stage"
          test -f "$stage/index.html"
          test -f "$stage/CNAME"
          test -f "$stage/sitemap.xml"
          test -f "$stage/src/build.mjs"
          test -f "$stage/qa.py"
          test "$(cat "$stage/CNAME")" = 'browslium.com'
          for locale in en es ru yi he pt-br fr; do
            test -f "$stage/$locale/index.html"
            test -f "$stage/$locale/support/index.html"
            test -f "$stage/$locale/privacy/index.html"
            test -f "$stage/$locale/terms/index.html"
          done
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$stage/." .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace old website with seven-language Browslium site'
          git push origin HEAD:main
