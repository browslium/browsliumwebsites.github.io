name: Publish Browslium international website R4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify archive and publish complete site
        shell: bash
        run: |
          set -euo pipefail
          archive='Browslium_WEB_INTERNATIONAL_7LOCALES_SEO_SOCIAL_R4_20261006_201801.zip'
          expected_sha='ece69ce28e15252c95534f3d212c2108c55b93a68cb0a58561d288677fa54cbe'
          test -f "$archive"
          actual_sha="$(sha256sum "$archive" | cut -d ' ' -f1)"
          test "$actual_sha" = "$expected_sha"
          stage="$(mktemp -d)"
          unzip -q "$archive" -d "$stage"
          test -f "$stage/index.html"
          test -f "$stage/CNAME"
          test -f "$stage/sitemap.xml"
          test "$(cat "$stage/google80ba342909e82f35.html")" = 'google-site-verification: google80ba342909e82f35.html'
          test -f "$stage/src/build.mjs"
          test -f "$stage/src/explainers.mjs"
          test -f "$stage/qa.py"
          test "$(cat "$stage/CNAME")" = 'browslium.com'
          for locale in en es ru yi he pt-br fr; do
            for page in '' image-filtering/ video-filtering/ support/ privacy/ terms/; do
              test -f "$stage/$locale/$page/index.html"
            done
          done
          ln -s . "$stage/dist"
          (cd "$stage" && python3 qa.py)
          rm "$stage/dist"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$stage/." .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish social identity and seven-language SEO refinements'
          git push origin HEAD:main
